[workspace]
members = [
  ".",
  "crates/serverpulse-core",
  "crates/serverpulse-ssh",
  "crates/serverpulse-platform",
]
resolver = "2"

[package]
name = "serverpulse-tauri"
version = "2.0.0"
description = "Cross-platform Server Pulse desktop application"
authors = ["Server Pulse"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
zeroize = { version = "1", features = ["alloc"] }
serverpulse-core = { path = "crates/serverpulse-core" }
serverpulse-ssh = { path = "crates/serverpulse-ssh" }
serverpulse-platform = { path = "crates/serverpulse-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
