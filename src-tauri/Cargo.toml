[workspace]
members = [
  ".",
  "crates/serverpulse-core",
  "crates/serverpulse-ssh",
  "crates/serverpulse-platform",
]
resolver = "2"

[package]
name = "serverpulse-tauri"
version = "2.0.0-preview.1"
description = "Cross-platform Server Pulse desktop application"
authors = ["Server Pulse"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }
serverpulse-core = { path = "crates/serverpulse-core" }
serverpulse-ssh = { path = "crates/serverpulse-ssh" }
serverpulse-platform = { path = "crates/serverpulse-platform" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
