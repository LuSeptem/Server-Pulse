<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Server Pulse</title>
  <desc id="desc">A simplified two-bay server rack crossed by a live monitoring pulse.</desc>
  <defs>
