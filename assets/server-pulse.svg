  <g fill="#17201A" stroke="#0C110E" stroke-width="13" stroke-linejoin="round">
    <rect x="18" y="20" width="92" height="35" rx="7"/>
    <rect x="18" y="73" width="92" height="35" rx="7"/>
  </g>
  <g fill="#17201A" stroke="#829087" stroke-width="7" stroke-linejoin="round">
    <rect x="18" y="20" width="92" height="35" rx="7"/>
    <rect x="18" y="73" width="92" height="35" rx="7"/>
  </g>

  <circle cx="31" cy="37.5" r="5" fill="#75CAD5" stroke="#0C110E" stroke-width="3"/>
  <circle cx="31" cy="90.5" r="5" fill="#A7D948" stroke="#0C110E" stroke-width="3"/>

  <path d="M12 65h27l10-15 14 32 15-39 12 22h26"
