name: Server Pulse Tauri Preview

on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Run Windows validation and portable build only
        type: boolean
        default: false
  push:
    tags:
      - "tauri-v*"

permissions:
  contents: read

jobs:
  core:
    name: Rust core and frontend tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend exec -- playwright install chromium
      - run: npm --prefix frontend run test:e2e
      - name: GPU sampler regression tests
        shell: bash
        run: sh tests/sampler-gpu.test.sh
      - run: cargo test --workspace --manifest-path src-tauri/Cargo.toml

  windows-build:
    name: Windows x64 Tauri build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix frontend
      - name: Build Windows portable executable
        run: npm --prefix frontend exec -- tauri build --config src-tauri/tauri.conf.json --ci --no-bundle
      - name: Stage and verify portable executable
        shell: pwsh
        run: |
          $buildExe = 'src-tauri/target/release/serverpulse-tauri.exe'
          Copy-Item -LiteralPath $buildExe -Destination 'ServerPulse-Portable.exe'
          $buildHash = (Get-FileHash -LiteralPath $buildExe -Algorithm SHA256).Hash
          $portableHash = (Get-FileHash -LiteralPath 'ServerPulse-Portable.exe' -Algorithm SHA256).Hash
          if ($buildHash -ne $portableHash) { throw 'Portable executable hash mismatch' }
          "$portableHash  ServerPulse-Portable.exe" | Set-Content -LiteralPath 'ServerPulse-Portable.exe.sha256' -Encoding ascii
          Write-Output "Verified portable SHA256: $portableHash"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/tauri-v')
        with:
          name: server-pulse-windows-x64
          path: |
            ServerPulse-Portable.exe
            ServerPulse-Portable.exe.sha256
          if-no-files-found: error

  macos-build:
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_only
    name: macOS ${{ matrix.arch }} Tauri build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: apple-silicon
            runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci --prefix frontend
      - uses: tauri-apps/tauri-action@v1
        with:
          projectPath: .
          tauriScript: npm --prefix frontend exec -- tauri
          args: --config src-tauri/tauri.conf.json --ci --target ${{ matrix.target }}
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/tauri-v') }}
          workflowArtifactNamePattern: server-pulse-macos-${{ matrix.arch }}
